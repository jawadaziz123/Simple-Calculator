<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="operator btn">C</button>
            <button class="operator btn"><</button>
            <button class="operator btn">%</button>
            <button class="operator btn dif">/</button>
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="operator btn dif">x</button>
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>
            <button class="operator btn dif">-</button>
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="operator btn dif">+</button>
            <button class="btn">0</button>
            <button class="btn">&#183;</button>
            <button class="operator btn">&#177;</button>
            <button class="operator btn dif ">=</button>
              
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
